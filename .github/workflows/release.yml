name: Release

# Publishes to npm when a version tag (v*) is pushed. Auth uses an npm automation
# token (repo secret NPM_TOKEN) which bypasses 2FA OTP, so a release is just a tag
# push — no interactive publish step. The same build/test/proof/secret-scan gates as
# CI run first, and the tag must match package.json version, so a broken or
# mislabelled build can never be published.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tag matches package.json version
        run: |
          set -e
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1
          fi
          echo "version tag OK: $GITHUB_REF_NAME"
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and typecheck
        run: npm run build && npm run typecheck
      - name: CLI smoke
        run: node bin/ihow-memory.mjs --version
      - name: Tests
        run: |
          if [ -d tests ]; then npm test; else echo "no tests/"; fi
      - name: Governed-loop proof
        run: node scripts/proof.mjs
      - name: Secret scan
        run: npm run secret-scan
        env:
          IHOW_PUBLIC_BOUNDARY_DENYLIST: ${{ secrets.IHOW_PUBLIC_BOUNDARY_DENYLIST }}
      - name: Build exact release artifact and evidence
        run: npm run release:evidence
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.ref_name }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact artifact to npm
        # Prereleases (-alpha/-beta/-rc) publish under the `next` dist-tag so `npm install ihow-memory`
        # keeps resolving the last stable/`latest`; stable tags publish to `latest`.
        run: |
          TAG=latest
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) TAG=next ;;
          esac
          PACKAGE="./release-evidence/ihow-memory-${GITHUB_REF_NAME#v}.tgz"
          echo "publishing $GITHUB_REF_NAME with dist-tag: $TAG"
          sha256sum --check --ignore-missing release-evidence/checksums.txt
          npm publish "$PACKAGE" --tag "$TAG" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
